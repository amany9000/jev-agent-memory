[project]
name = "typesafe-agent-memory-poc"
version = "0.1.0"
description = "POC: TypeSafe as the graph maker for neo4j-agent-memory, driving a LangChain agent on Neo4j Aura"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Memory graph + LangChain 1.x middleware. spaCy + GLiNER are the extraction
    # pipeline (see build_settings() in langchain_agent_memory.py).
    "neo4j-agent-memory[langchain-agents,spacy,gliner]>=0.6.0,<0.7",
    # spaCy's transformer-based English model (better NER accuracy than en_core_web_sm),
    # as a direct wheel — `spacy download` isn't a dependency uv can resolve, so this
    # pins the model to a version compatible with the spacy release above. ~440MB.
    "en-core-web-trf @ https://github.com/explosion/spacy-models/releases/download/en_core_web_trf-3.8.0/en_core_web_trf-3.8.0-py3-none-any.whl",
    "spacy-transformers>=1.4",
    # Local ONNX embeddings (see fastembed_embedder.py).
    "fastembed>=0.8",
    # DeepSeek chat model for the agent.
    "langchain-deepseek>=1.1",
    # TypeSafe: used by tests/test_typesafe.py and typesafe_extractor.py (an
    # alternative extractor, not the one build_settings() wires up by default).
    "typesafe-sdk>=0.7.1",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# `markers` are also registered dynamically in tests/conftest.py::pytest_configure
# (with descriptions); listed here too so `pytest --markers` is discoverable
# without needing --strict-markers to fail on a typo.
markers = [
    "neo4j: needs a live Neo4j Aura connection",
    "deepseek: needs DEEPSEEK_API_KEY",
    "typesafe: makes a real, billed TypeSafe API call — opt in with --run-typesafe",
]

[tool.uv]
# Scripts, not an installable package.
package = false
