[project]
name = "typesafe-agent-memory-poc"
version = "0.1.0"
description = "POC: TypeSafe as the graph maker for neo4j-agent-memory, driving a LangChain agent on Neo4j Aura"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Memory graph + LangChain 1.x middleware, GLiNER candidates.
    "neo4j-agent-memory[langchain-agents,gliner]>=0.6.0,<0.7",
    # Local ONNX embeddings (see fastembed_embedder.py).
    "fastembed>=0.8",
    # DeepSeek chat model for the agent.
    "langchain-deepseek>=1.1",
    # TypeSafe: types candidate entities and relations.
    "typesafe-sdk>=0.7.1",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# `markers` are also registered dynamically in tests/conftest.py::pytest_configure
# (with descriptions); listed here too so `pytest --markers` is discoverable
# without needing --strict-markers to fail on a typo.
markers = [
    "neo4j: needs a live Neo4j Aura connection",
    "deepseek: needs DEEPSEEK_API_KEY",
    "typesafe: makes a real, billed TypeSafe API call — opt in with --run-typesafe",
]

[tool.uv]
# Scripts, not an installable package.
package = false
